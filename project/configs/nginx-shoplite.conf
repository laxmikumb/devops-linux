server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shoplite-web01 _;

    root /var/www/shoplite;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
