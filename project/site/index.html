<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopLite</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    header { background: #1f6feb; color: #fff; padding: 24px; text-align: center; }
    .grid { display: flex; gap: 16px; padding: 24px; justify-content: center; flex-wrap: wrap; }
    .card { background: #fff; border-radius: 8px; padding: 16px; width: 200px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    footer { text-align: center; padding: 16px; color: #666; }
  </style>
</head>
<body>
  <header><h1>ShopLite</h1><p>Simple products, simple prices</p></header>
  <div class="grid">
    <div class="card"><h3>Notebook</h3><p>Rs. 120</p></div>
    <div class="card"><h3>Backpack</h3><p>Rs. 899</p></div>
    <div class="card"><h3>Water Bottle</h3><p>Rs. 249</p></div>
  </div>
  <footer>Served by Nginx on shoplite-web01</footer>
</body>
</html>
